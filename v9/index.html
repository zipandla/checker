/* ===== v2：スマホ優先・和のあしらい ===== */
:host{display:block;--bg:#f4f5f2;--surface:#ffffff;--ink:#14212f;--muted:#4f5d6b;--line:#d9dcd5;--accent:#ffe234;--vermil:#d8452f;--matcha:#e6f0d9;--matcha-ink:#2f5a1d;--sakura:#fde9ec;--f-display:"Zen Maru Gothic","Zen Kaku Gothic New","Noto Sans JP",sans-serif}
:host{background-color:var(--bg);font-size:16px}
header{border-top:6px solid var(--vermil);background:linear-gradient(var(--bg),rgba(244,245,242,.0));padding-block:20px 8px}
.us{display:none}
h1{font-size:clamp(27px,7.2vw,40px);line-height:1.3}
h1 em{background:linear-gradient(transparent 58%,var(--accent) 58%)}
.lead{font-size:15px;line-height:1.8}
.premise{border-radius:14px;border:1px dashed #a9bccb;background:rgba(255,255,255,.9);font-size:13px}
header h1,header .lead,.regions-cap{text-shadow:0 0 8px #f4f5f2,0 0 14px #f4f5f2}
.regions{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.regions li{list-style:none;flex:none;width:68px;text-align:center;font-size:11px;line-height:1.35;color:var(--muted)}
.regions svg{display:block;width:52px;height:52px;margin:0 auto 4px;background:#fff;border-radius:50%;border:2px solid var(--line);padding:7px}
.regions b{display:block;font-size:11.5px;color:var(--ink)}
.regions-cap{margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:15px}
.prog{background:rgba(244,245,242,.94);backdrop-filter:blur(4px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.prog .bar{height:12px;border-radius:99px;background:#fff;border:1.5px solid var(--line)}
.prog .bar i{border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffb84d)}
.prog.full .bar i{background:#79b04a}
.prog span{font-size:15px}
.q{border:0;background:var(--surface);border-radius:22px;padding:16px 16px 18px;margin-top:14px;box-shadow:0 3px 0 var(--line);position:relative}
.q h2{font-size:17px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;margin:0 0 6px}
.q h2 span{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:0;border-radius:50%;background:var(--navy);color:var(--accent);font-size:13px;font-weight:900}
.q .hint{font-size:13px;margin:0 0 10px 42px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.opts label{display:block}
.opts span{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid var(--line);border-radius:14px;background:#f7fafc;font-size:15px;line-height:1.4;padding:8px 10px;transition:background .12s,border-color .12s,transform .08s}
.opts input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:0 3px 0 rgba(22,35,59,.3)}
.opts input:checked+span::before{content:"✓";color:var(--accent);margin-right:6px;font-weight:900}
.opts span:active{transform:scale(.97)}
.q:has(input:checked)::after{content:"";position:absolute;right:14px;top:16px;width:10px;height:10px;border-radius:50%;background:#79b04a}
.lchk{border-radius:14px;border-left:0;background:var(--sakura);margin:12px 0 0;padding:12px 14px}

.actions{margin-top:14px;padding:4px 0 8px;display:grid;grid-template-columns:1fr;gap:8px}
form.ready .actions{position:sticky;bottom:0;z-index:4;padding:12px 0 12px;background:linear-gradient(rgba(244,245,242,0),var(--bg) 30%)}
.actions .btn.ghost{min-height:44px;font-size:14px;padding:10px 18px;background:transparent;border:1.5px solid #a9bccb;box-shadow:none}
.btn{border-radius:999px;font-size:16px;padding:14px 22px;min-height:52px}
.btn:not(.ghost){background:var(--accent);box-shadow:0 4px 0 rgba(20,24,31,.3)}
.btn:not(.ghost):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,24,31,.3)}
.btn.ghost{background:#fff}
.left{font-size:13.5px;text-align:center}
.panel{border-radius:22px;overflow:hidden;border:0;box-shadow:0 3px 0 var(--line)}
.total{background:linear-gradient(135deg,#16233b,#243b63)}
.item{padding:14px 16px}
.item h3{font-size:16px}
.sec{background:#f1f6fa;font-size:12.5px}

.strength{border-radius:0}

/* v2.1：01ブロックを強く */
.strength{background:var(--navy);color:#fff;padding:30px 22px 26px;text-align:center;border-top:6px solid var(--accent)}
