/* Layout: 左に9つの設問、右に「足りない項目」と目安金額が回答に合わせて変わる。スマホでは縦に並ぶ */
:host{display:block;
  --bg:#f4f5f2; --surface:#ffffff; --ink:#14181f; --muted:#5a6270; --line:#d9dcd5;
  --accent:#ffe234; --accent-ink:#14181f; --navy:#16233b; --navy-ink:#f4f5f2;
  --warn-bg:#fff3d6; --warn-ink:#6b4a00; --ok:#1d6b4a;
  --f-display:"Zen Kaku Gothic New","Noto Sans JP",sans-serif;
  --f-body:"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif;
}


*{box-sizing:border-box}
:host{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.75;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.wrap{max-width:1080px;margin:0 auto;container-type:inline-size}
header{padding-block:28px 20px;border-top:4px solid #c0303f}
.us{display:block;margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.14em;color:#c0303f}
.eyebrow{display:inline-block;background:var(--navy);color:var(--navy-ink);font-size:12px;font-weight:700;letter-spacing:.08em;padding:2px 10px}
h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,5vw,42px);line-height:1.25;margin:12px 0 8px;text-wrap:balance}
h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--accent) 62%)}
.lead{color:var(--muted);max-width:42em;margin:0}
.premise{margin-top:16px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:28px;align-items:start}
@container (max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.sample{background:var(--warn-bg);color:var(--warn-ink);padding:8px 12px;font-size:13px;margin-bottom:16px}
.prog{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;background:var(--bg);padding:10px 0;margin-bottom:2px}
.prog span{font-family:var(--f-display);font-weight:900;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.prog .bar{flex:1;height:8px;background:var(--line);overflow:hidden}
.prog .bar i{display:block;height:100%;width:0;background:var(--navy);transition:width .25s ease}
.prog.full .bar i{background:var(--ok)}
@media (prefers-reduced-motion:reduce){.prog .bar i{transition:none}}
.q{border-top:1px solid var(--line);padding-block:16px}
.q h2{font-family:var(--f-display);font-size:16px;font-weight:700;line-height:1.5;margin:0 0 4px}
.q h2 span{color:var(--muted);font-weight:700;margin-right:6px;font-variant-numeric:tabular-nums}
.q .hint{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{position:relative}
.opts input{position:absolute;opacity:0;inset:0;width:100%;height:100%;margin:0;cursor:pointer}
.opts span{display:block;border:1.5px solid var(--line);background:var(--surface);padding:6px 14px;font-size:14px;line-height:1.5;cursor:pointer}
.opts input:checked+span{background:var(--navy);color:var(--navy-ink);border-color:var(--navy);font-weight:700}
.opts input:focus-visible+span{outline:3px solid var(--accent);outline-offset:2px}
.result{position:sticky;top:12px;min-width:0}
@container (max-width:820px){.result{position:static}}
.panel{background:var(--surface);border:1px solid var(--line)}
.total{background:var(--navy);color:var(--navy-ink);padding:18px 20px}
.total .lbl{font-size:12px;letter-spacing:.06em;opacity:.8}
.total .big{font-family:var(--f-display);font-weight:900;font-size:clamp(30px,6vw,40px);line-height:1.2;font-variant-numeric:tabular-nums}
.total .big small{font-size:15px;font-weight:700;margin-left:6px}
.total .sub{margin-top:6px;font-size:13.5px}
.total .sub2{margin-top:10px;padding-top:8px;border-top:1px solid rgba(255,255,255,.25);font-size:12.5px;opacity:.85}
.lchk{margin-top:10px;border-left:4px solid var(--accent);background:var(--surface);padding:10px 14px}
.lchk h3{font-family:var(--f-display);font-size:16px;margin:0 0 4px}
.lchk .lead2{font-size:13px;color:var(--muted);margin:0 0 10px}
.lchk ul.lk{margin:0;padding-left:1.2em;font-size:13.5px}
.lchk ul.lk li{margin-bottom:3px}
.lchk label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-top:1px solid var(--line);font-size:13.5px;line-height:1.6;cursor:pointer}
.lchk label:first-of-type{border-top:0}
.lchk input{margin-top:5px;width:18px;height:18px;flex:none;accent-color:var(--navy)}
.lchk label b{display:block;font-size:13.5px}
.lchk label small{display:block;color:var(--muted);font-size:12.5px}
.lchk .res{margin-top:10px;padding:8px 12px;font-size:13px;background:var(--warn-bg);color:var(--warn-ink)}
.lchk .res.good{background:var(--bg);color:var(--ink);border:1px solid var(--line)}
.strength{background:var(--accent);color:var(--accent-ink);padding:16px 20px;border-top:1px solid var(--line)}
.strength h3{font-family:var(--f-display);font-size:16px;margin:0 0 6px}
.strength ul{margin:0;padding-left:1.2em;font-size:13.5px}
.strength li{margin-bottom:3px}
.strength{position:relative;overflow:hidden}
.strength h3{font-size:20px;line-height:1.4}
.strength .s0{margin:0;font-size:13.5px}
.strength .zero{display:flex;align-items:center;gap:10px;margin:14px 0 6px}
.strength .zero b{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:var(--navy);color:var(--accent);font-family:var(--f-display);font-size:30px;font-weight:900;line-height:1}
.strength .zero b:last-child{width:60px;height:60px;font-size:36px;box-shadow:0 0 0 5px rgba(22,35,59,.18)}
.strength .zero i{font-style:normal;font-size:24px;font-weight:900;color:var(--navy)}
.strength .s01{margin:6px 0 0;font-size:13.5px;line-height:1.75}
.strength .s01 strong{font-family:var(--f-display);font-size:16px}
.strength a.lp{display:flex;flex-direction:column;gap:2px;margin-top:16px;background:var(--navy);color:var(--navy-ink);padding:16px 20px;border-radius:999px;text-decoration:none;box-shadow:0 5px 0 rgba(20,24,31,.35);transition:transform .12s,box-shadow .12s}
.strength a.lp span{font-size:12px;opacity:.85;text-align:center}
.strength a.lp strong{font-family:var(--f-display);font-size:21px;display:flex;justify-content:center;align-items:center;gap:10px}
.strength a.lp i{font-style:normal;font-size:24px;color:var(--accent);display:inline-block;animation:nudge 1.4s ease-in-out infinite}
.strength a.lp:hover{transform:translateY(3px);box-shadow:0 2px 0 rgba(20,24,31,.35)}
.strength a.lp:focus-visible{outline:3px solid var(--navy);outline-offset:3px}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){.strength a.lp,.strength a.lp i{transition:none;animation:none}}
.total mark{background:var(--accent);color:var(--accent-ink);padding:0 6px;font-weight:700}
.items{list-style:none;margin:0;padding:0}
.item{padding:14px 20px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 16px}
.item:first-child{border-top:0}
.item h3{font-family:var(--f-display);font-size:15.5px;margin:0;font-weight:700}
.item p{grid-column:1/-1;margin:2px 0 0;font-size:13.5px;color:var(--muted)}
.price{text-align:right;font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.price small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.tag{display:inline-block;font-size:11.5px;font-weight:700;padding:0 8px;margin-left:8px;vertical-align:1px;background:var(--accent);color:var(--accent-ink)}
.done{color:var(--ok);font-weight:700}
.sec{padding:12px 20px;background:var(--bg);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--muted);border-top:1px solid var(--line)}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:12px 20px;font-size:13.5px;border-top:1px solid var(--line)}
.notes{padding:14px 20px;border-top:1px solid var(--line);font-size:13.5px}
.notes ul{margin:6px 0 0;padding-left:1.2em}
.notes li{margin-bottom:4px}
.consult{padding:16px 20px;border-top:1px solid var(--line)}
.consult h3{font-family:var(--f-display);margin:0 0 4px;font-size:15.5px}
.consult p{margin:0 0 10px;font-size:13.5px;color:var(--muted)}
button{font:inherit;cursor:pointer}
.btn{background:var(--accent);color:var(--accent-ink);border:2px solid var(--ink);padding:8px 16px;font-weight:700}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line);margin-left:8px}
.btn:focus-visible{outline:3px solid var(--navy);outline-offset:2px}
.entities{font-size:12.5px;color:var(--muted);margin-top:10px}
.fine{font-size:12px;color:var(--muted);padding:14px 20px;border-top:1px solid var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.actions .btn.ghost{margin-left:0}
.left{font-size:13px;color:var(--muted);margin-top:8px;min-height:1.5em}
.empty{padding:28px 22px}
.empty h3{font-family:var(--f-display);font-size:17px;margin:0 0 6px}
.empty p{margin:0;font-size:13.5px;color:var(--muted)}
.proto{font-size:12px;color:var(--muted);margin-top:24px}

/* ===== v2：スマホ優先・和のあしらい ===== */
:host{display:block;--bg:#f4f5f2;--surface:#ffffff;--ink:#14212f;--muted:#4f5d6b;--line:#d9dcd5;--accent:#ffe234;--vermil:#d8452f;--matcha:#e6f0d9;--matcha-ink:#2f5a1d;--sakura:#fde9ec;--f-display:"Zen Maru Gothic","Zen Kaku Gothic New","Noto Sans JP",sans-serif}
:host{background-color:var(--bg);font-size:16px}
header{border-top:6px solid var(--vermil);background:linear-gradient(var(--bg),rgba(244,245,242,.0));padding-block:20px 8px}
.us{display:none}
h1{font-size:clamp(27px,7.2vw,40px);line-height:1.3}
h1 em{background:linear-gradient(transparent 58%,var(--accent) 58%)}
.lead{font-size:15px;line-height:1.8}
.premise{border-radius:14px;border:1px dashed #a9bccb;background:rgba(255,255,255,.9);font-size:13px}
header h1,header .lead,.regions-cap{text-shadow:0 0 8px #f4f5f2,0 0 14px #f4f5f2}
.regions{display:flex;gap:6px;overflow-x:auto;margin:16px -16px 4px;padding:2px 16px 8px;scrollbar-width:none}
.regions::-webkit-scrollbar{display:none}
.regions li{list-style:none;flex:none;width:68px;text-align:center;font-size:11px;line-height:1.35;color:var(--muted)}
.regions svg{display:block;width:52px;height:52px;margin:0 auto 4px;background:#fff;border-radius:50%;border:2px solid var(--line);padding:7px}
.regions b{display:block;font-size:11.5px;color:var(--ink)}
.regions-cap{margin:14px 0 0;font-family:var(--f-display);font-weight:700;font-size:15px}
.prog{background:rgba(244,245,242,.94);backdrop-filter:blur(4px);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.prog .bar{height:12px;border-radius:99px;background:#fff;border:1.5px solid var(--line)}
.prog .bar i{border-radius:99px;background:linear-gradient(90deg,var(--accent),#ffb84d)}
.prog.full .bar i{background:#79b04a}
.prog span{font-size:15px}
.q{border:0;background:var(--surface);border-radius:22px;padding:16px 16px 18px;margin-top:14px;box-shadow:0 3px 0 var(--line);position:relative}
.q h2{font-size:17px;line-height:1.5;display:flex;gap:10px;align-items:flex-start;margin:0 0 6px}
.q h2 span{flex:none;display:grid;place-items:center;width:32px;height:32px;margin:0;border-radius:50%;background:var(--navy);color:var(--accent);font-size:13px;font-weight:900}
.q .hint{font-size:13px;margin:0 0 10px 42px}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:10px}
.opts label{display:block}
.opts span{min-height:52px;display:flex;align-items:center;justify-content:center;text-align:center;border:2px solid var(--line);border-radius:14px;background:#f7fafc;font-size:15px;line-height:1.4;padding:8px 10px;transition:background .12s,border-color .12s,transform .08s}
.opts input:checked+span{background:var(--navy);color:#fff;border-color:var(--navy);font-weight:700;box-shadow:0 3px 0 rgba(22,35,59,.3)}
.opts input:checked+span::before{content:"✓";color:var(--accent);margin-right:6px;font-weight:900}
.opts span:active{transform:scale(.97)}
.q:has(input:checked)::after{content:"";position:absolute;right:14px;top:16px;width:10px;height:10px;border-radius:50%;background:#79b04a}
.lchk{border-radius:14px;border-left:0;background:var(--sakura);margin:12px 0 0;padding:12px 14px}
.lchk h3{font-size:15px}
.actions{margin-top:14px;padding:4px 0 8px;display:grid;grid-template-columns:1fr;gap:8px}
form.ready .actions{position:sticky;bottom:0;z-index:4;padding:12px 0 12px;background:linear-gradient(rgba(244,245,242,0),var(--bg) 30%)}
.actions .btn.ghost{min-height:44px;font-size:14px;padding:10px 18px;background:transparent;border:1.5px solid #a9bccb;box-shadow:none}
.btn{border-radius:999px;font-size:16px;padding:14px 22px;min-height:52px}
.btn:not(.ghost){background:var(--accent);box-shadow:0 4px 0 rgba(20,24,31,.3)}
.btn:not(.ghost):active{transform:translateY(3px);box-shadow:0 1px 0 rgba(20,24,31,.3)}
.btn.ghost{background:#fff}
.left{font-size:13.5px;text-align:center}
.panel{border-radius:22px;overflow:hidden;border:0;box-shadow:0 3px 0 var(--line)}
.total{background:linear-gradient(135deg,#16233b,#243b63)}
.item{padding:14px 16px}
.item h3{font-size:16px}
.sec{background:#f1f6fa;font-size:12.5px}
.done{color:var(--matcha-ink)}
.strength{border-radius:0}
.banner{font-size:14px}
.empty{padding:22px 18px;text-align:center}
.cform{border-radius:22px;padding:18px 16px}
.cform input[type=text],.cform input[type=email]{font-size:16px;padding:12px 14px;border-radius:12px;background:#f7fafc}
.chk{font-size:14px}
.chk input{width:22px;height:22px;flex:none;margin-top:2px}
.acts{display:grid;grid-template-columns:1fr;gap:8px}
.proto{font-size:12px}
@media (min-width:560px){.opts{grid-template-columns:repeat(3,minmax(0,1fr))}.actions{grid-template-columns:auto auto;justify-content:start}}
@container (min-width:821px){.opts{grid-template-columns:repeat(2,minmax(0,1fr))}.actions{position:static;background:none}}
@media (prefers-reduced-motion:reduce){.opts span,.btn{transition:none}}

/* v2.1：01ブロックを強く */
.strength{background:var(--navy);color:#fff;padding:30px 22px 26px;text-align:center;border-top:6px solid var(--accent)}
.strength .s0{font-size:13.5px;color:#cfd8e6;margin:0}
.strength .zero{justify-content:center;gap:14px;margin:14px 0 10px}
.strength .zero b{width:84px;height:84px;font-size:54px;background:var(--accent);color:var(--navy)}
.strength .zero b:last-child{width:104px;height:104px;font-size:70px;box-shadow:0 0 0 8px rgba(255,210,63,.25)}
.strength .zero i{font-size:38px;color:var(--accent)}
.strength .s01{font-size:14px;color:#e6ecf5;margin:0}
.strength .s01 strong{display:block;font-size:24px;line-height:1.4;color:#fff;margin-bottom:6px}
.strength a.lp{background:var(--accent);color:var(--navy);box-shadow:0 6px 0 #c79a00;animation:pulse 2.2s ease-in-out infinite}
.strength a.lp span{opacity:1;font-weight:700}
.strength a.lp strong{font-size:23px}
.strength a.lp i{color:var(--navy)}
.strength a.lp:hover{box-shadow:0 2px 0 #c79a00}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.03)}}
@media (prefers-reduced-motion:reduce){.strength a.lp{animation:none}}

.s01wrap{margin-bottom:16px;border-radius:22px;overflow:hidden}
.s01pill{display:inline-flex;align-items:center;gap:8px;margin-top:12px;background:var(--navy,#16233b);color:#fff;text-decoration:none;font-weight:700;font-size:14px;border-radius:999px;padding:8px 16px 8px 8px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.s01pill b{background:var(--accent,#ffe234);color:var(--navy,#16233b);border-radius:999px;padding:3px 10px;font-weight:900;font-size:13px}
.s01pill i{font-style:normal;color:var(--accent,#ffe234)}

/* ===== v4：紺と黄色・実務ツール ===== */
header{border-top:6px solid #c0303f;background:none}
.q[data-id="renew"]{background:#fff8cc;border:2px solid #ffe234;box-shadow:0 3px 0 #e6c800}
.q[data-id="renew"] h2::after{content:"12/31まで";margin-left:auto;flex:none;font-size:12px;font-weight:900;background:#c0303f;color:#fff;border-radius:999px;padding:2px 10px}
.q[data-id="renew"] .hint{color:#5a4a00}
.q[data-id="renew"] .opts span{background:#fffdf0;border-color:#e6d77a}
.q[data-id="renew"] .opts input:checked+span{background:var(--navy);border-color:var(--navy)}
.q h2 span{border-radius:8px}
.opts span{min-height:58px;font-size:15.5px;border-radius:12px}
.total{background:linear-gradient(135deg,#16233b,#243b63)}
.sec{background:#eceee8}
.strength{background:var(--navy)}

/* ===== v5：白＋紺の土台、黄色は押すところだけ ===== */
:host{display:block;--bg:#ffffff;--line:#e1e5ee;--muted:#4a5568}
:host{background:#fff}
header{border-top:0;background:var(--navy);color:#fff;border-radius:22px;padding:22px 18px 18px;margin-top:12px}
header h1{color:#fff;text-shadow:none}
header h1 em{background:none;color:#ffe234}
header .lead{color:#dbe3f0;text-shadow:none}
.regions-cap{color:#fff;text-shadow:none}
.regions{margin:14px -18px 4px;padding:2px 18px 8px}
.regions li{width:84px;color:#c4d0e4;font-size:11.5px}
.regions b{color:#fff;font-size:13px}
.regions svg{width:70px;height:70px;padding:11px;border:3px solid #ffe234;background:#fff}
header .premise{background:rgba(255,255,255,.08);border:1px dashed rgba(255,255,255,.35);color:#dbe3f0}
.s01pill{background:#ffe234;color:#14181f;box-shadow:0 4px 0 #c7a900}
.s01pill b{background:var(--navy);color:#ffe234}
.s01pill i{color:#14181f}
.prog{background:rgba(255,255,255,.96);border-bottom:1px solid var(--line)}
.prog .bar{background:#eef1f6}
